<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Menu - BurjoGo</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://unpkg.com/feather-icons"></script>
</head>
<body>

    <nav class="navbar">
        <div class="nav-logo">BurjoGo</div>
        <ul class="nav-menu">
            <li><a href="index.html">Home</a></li>
            <li><a href="menu.html" class="active">Menu</a></li>
            <li><a href="cart.html">Keranjang</a></li>
        </ul>
        <div class="nav-right">
            <a href="cart.html" class="cart-icon">
                <i data-feather="shopping-cart"></i>
                <span id="cart-count">0</span>
            </a>
        </div>
    </nav>

    <header class="menu-header">
        <h1>Menu BurjoGo</h1>
        <p>Pilih kategori makanan favoritmu</p>
    </header>

    <div class="menu-tabs">
        <button class="tab active" data-category="makanan">Makanan</button>
        <button class="tab" data-category="minuman">Minuman</button>
        <button class="tab" data-category="snack">Snack</button>
    </div>

    <div class="menu-grid" id="menu-container"></div>

    <footer>
        <p>© 2026 BurjoGo - Platform Pemesanan Burjo Digital</p>
    </footer>

    <script src="app.js"></script>
    <script>
        feather.replace();

        // Load data awal, lalu render kategori 'makanan' sebagai default
        loadMenu(() => {
            renderMenu("makanan");
        });

        // FILTER TABS LOGIC
        const tabs = document.querySelectorAll(".tab");
        tabs.forEach(tab => {
            tab.addEventListener("click", () => {
                tabs.forEach(t => t.classList.remove("active"));
                tab.classList.add("active");
                
                const category = tab.dataset.category;
                renderMenu(category);
            });
        });
    </script>
</body>
</html>
