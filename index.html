<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BurjoGo - Home</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://unpkg.com/feather-icons"></script>
</head>
<body>

<nav class="navbar">
    <div class="nav-logo">BurjoGo</div>

    <ul class="nav-menu">
        <li><a href="index.html" class="active">Home</a></li>
        <li><a href="menu.html">Menu</a></li>
        <li><a href="cart.html">Keranjang</a></li>
    </ul>

    <div class="nav-right">
        <a href="cart.html" class="cart-icon">
            <i data-feather="shopping-cart"></i>
            <span id="cart-count">0</span>
        </a>
    </div>
</nav>

<header class="hero">
    <div class="hero-content">
        <h1>Selamat Datang di <span>BurjoGo</span></h1>
        <p>Solusi kuliner cepat, bersahabat, dan hemat ramah kantong mahasiswa!</p>
        <a href="menu.html" class="btn">Lihat Semua Menu</a>
    </div>

    <div class="hero-image">
        <img src="img/burjogo_logo2.png" alt="BurjoGo Hero">
    </div>
</header>

<section class="favorites">
    <h2 style="margin-top: -40px;">Menu Favorit</h2>

    <div class="fav-list" id="preview-menu"></div>

    <a href="menu.html" class="btn see-menu">Lihat Semua Menu</a>
</section>

<footer>
    <p>© 2026 BurjoGo - Sistem Pemesanan Online</p>
</footer>

<div id="toast-container"></div>

<script>
feather.replace();

// Ambil & Tampilkan Jumlah Item di Keranjang Belanja
let cart = JSON.parse(localStorage.getItem("cart")) || [];
document.getElementById("cart-count").innerText = cart.length;

// AMBIL DATA MENU DARI DATA.JSON
fetch("data.json")
    .then(res => {
        if (!res.ok) {
            throw new Error("Gagal memuat file data.json");
        }
        return res.json();
    })
    .then(data => {
        let container = document.getElementById("preview-menu");
        
        // Cek apakah data.menus ada dan isinya array
        if (!data.menus || !Array.isArray(data.menus)) {
            container.innerHTML = "<p style='text-align:center; color:#888;'>Format data menu salah.</p>";
            return;
        }

        // Ambil 4 menu teratas untuk dijadikan Menu Favorit di beranda
        let preview = data.menus.slice(0, 4); 

        container.innerHTML = "";
        preview.forEach(menu => {
            // KUNCI FIX 2: Tag <div id="toast-container"></div> di dalam string template ini sudah ditiadakan
            container.innerHTML += `
                <div class="menu-item">
                    <img src="${menu.gambar}" onerror="this.src='https://placehold.co/240x160?text=No+Image'">
                    <h3>${menu.nama}</h3>
                    <p class="desc">${menu.deskripsi}</p>
                    <p class="price">Rp ${menu.harga.toLocaleString('id-ID')}</p>
                    <button onclick="addToCart(${menu.id}, '${menu.nama}', ${menu.harga})">+ Tambah ke Cart</button>
                </div>
            `;
        });
    })
    .catch(err => {
        console.error("Error Fetching Data:", err);
        document.getElementById("preview-menu").innerHTML = 
            `<p style='text-align:center; color:red; grid-column: 1/-1;'>Gagal memuat menu favorit. Pastikan data.json sudah benar.</p>`;
    });

// FUNGSI ADDTOCART
function addToCart(id, nama, harga) {
    let item = cart.find(i => i.id === id);
    if (item) {
        item.qty++;
    } else {
        cart.push({ id, nama, harga, qty: 1 });
    }
    localStorage.setItem("cart", JSON.stringify(cart));
    document.getElementById("cart-count").innerText = cart.length;
    
    showToast(`${nama} berhasil dimasukkan ke keranjang!`);
}

// FUNGSI UTAMA PEMBUAT TOAST
function showToast(pesan) {
    let container = document.getElementById('toast-container');
    
    // KUNCI FIX 3: Gunakan insertAdjacentElement biar diletakkan di layer terluar jika hilang
    if (!container) {
        container = document.createElement('div');
        container.id = 'toast-container';
        document.body.insertAdjacentElement('beforeend', container);
    }
    
    // Bikin kotak toast baru
    const toast = document.createElement('div');
    toast.classList.add('toast-item');
    toast.innerHTML = `🛒 <span>${pesan}</span>`;
    
    // Masukkan kotak ke dalam wadah utama
    container.appendChild(toast);
    
    // Hapus otomatis elemen setelah 3 detik
    setTimeout(() => {
        toast.remove();
    }, 3000);
}
</script>

</body>
</html>
